st-enchanted-dark.png" alt="Everforest Enchanted 3.12.2 · dark: T3 Code left, Obsidian right"></div></figure><figure id="f5" hidden><figcaption>Everforest Enchanted 3.12.2 · light</figcaption><div class="image"><img src="/home/krisspy/Projects/obsidian/obsidian-t3code/docs/verification/issue-17/color-themes/everforest-enchanted-light.png" alt="Everforest Enchanted 3.12.2 · light: T3 Code left, Obsidian right"></div></figure><script>const choose=document.getElementById('choose'),zoom=document.getElementById('zoom');choose.onchange=()=>document.querySelectorAll('figure').forEach((f,i)=>f.hidden=i!==+choose.value);zoom.onchange=()=>document.querySelectorAll('.image').forEach(f=>f.classList.toggle('zoom',zoom.checked));</script></body></html>
